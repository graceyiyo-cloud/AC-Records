            <section id="reportPage" class="hidden desktop-half-width">
                
                <div class="stats-card stats-card-all p-4 text-white flex items-center mb-4 relative">
                    <div class="stats-side-label flex flex-col text-[10px] font-bold uppercase tracking-widest mr-4 border-r border-white/15 pr-3 text-center leading-tight">
                        <span>全</span><span>部</span><span>年</span><span>份</span><span>總</span><span>累</span><span>計</span>
                    </div>
                    <div class="flex-1">
                        <div class="grid grid-cols-3 gap-2 text-center border-b border-white/10 pb-2 mb-2">
                            <div><p class="text-[10px] text-white/65">冷氣</p><p class="text-xl font-bold" id="allAc">0</p></div>
                            <div><p class="text-[10px] text-white/65">洗衣機</p><p class="text-xl font-bold" id="allWm">0</p></div>
                            <div><p class="text-[10px] text-white/65">水塔</p><p class="text-xl font-bold" id="allWt">0</p></div>
                        </div>
                        <div class="metric-box-grid">
                            <div class="metric-box metric-box-rev">
                                <span class="metric-box-label">總收入</span>
                                <span class="metric-box-value" id="allRev">$0</span>
                            </div>
                            <div class="metric-box metric-box-exp">
                                <span class="metric-box-label">小幫手</span>
                                <button onclick="showAllAssistantDetails()" id="allExp">$0</button>
                            </div>
                            <div class="metric-box metric-box-net">
                                <span class="metric-box-label">淨實收</span>
                                <span class="metric-box-value" id="allNet">$0</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="assistantSummaryOverlay" onclick="toggleAssistantModal()" class="hidden fixed inset-0 bg-black/40 backdrop-blur-[2px] z-[90]"></div>
                <div id="assistantSummaryModal" class="hidden bg-white rounded-2xl shadow-2xl p-5 border border-slate-200">
                    <div class="flex justify-between items-center mb-4 border-b pb-2">
                        <h4 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                            <i data-lucide="handshake" class="w-4 h-4"></i> <span id="assistantModalTitle">小幫手薪資總計 (全期)</span>
                        </h4>
                        <button onclick="toggleAssistantModal()" class="text-slate-400 text-xl hover:text-slate-600">&times;</button>
                    </div>
                    <div id="assistantSummaryList" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1"></div>
                    <div class="mt-4 pt-3 border-t text-[10px] text-slate-400 text-center">
                        點擊背景或叉叉可關閉
                    </div>
                </div>

                <div class="space-y-3 mb-4">
                    <div class="stats-card stats-card-year p-5">
                        <div>
                            <div class="flex justify-between items-start">
                                <h3 class="text-slate-500 text-[10px] font-bold uppercase tracking-widest" id="yearTitle">年度統計</h3>
                                <div class="text-[10px] text-slate-400">年度數量: <span class="text-slate-700 font-bold" id="yCounts">冷0 / 洗0 / 水0</span></div>
                            </div>
                            <div class="metric-box-grid mt-3">
                                <div class="metric-box metric-box-rev">
                                    <span class="metric-box-label">年度總營收</span>
                                    <span class="metric-box-value" id="yRev">$0</span>
                                </div>
                                <div class="metric-box metric-box-exp">
                                    <span class="metric-box-label">年度支出</span>
                                    <button onclick="showYearAssistantDetails()" id="yExp">$0</button>
                                </div>
                                <div class="metric-box metric-box-net">
                                    <span class="metric-box-label">年度淨利</span>
                                    <span class="metric-box-value" id="yNet">$0</span>
                                </div>
                            </div>

                            <div id="passYearSummarySection" class="pass-summary-wrap pass-year-theme pass-collapsed border-t border-slate-200 bg-slate-50/70 -mx-5 px-3 hidden">
                                <button type="button" class="pass-summary-head" onclick="togglePassSummary('passYearSummarySection')">
                                    <span class="pass-summary-title-area">
                                        <h3 class="text-slate-600 text-[10px] font-bold uppercase tracking-widest flex items-center gap-1">
                                            <i data-lucide="forward" class="w-3 h-3"></i> PASS 來源統計 (年度)
                                        </h3>
                                    </span>
                                    <span class="pass-summary-actions">
                                        <span class="pass-total-pill" id="passYearTotal">總額 $0</span>
                                        <span class="pass-toggle-pill"><span class="pass-toggle-text">展開</span></span>
                                    </span>
                                </button>
                                <div id="passYearSummaryList" class="pass-summary-list grid grid-cols-1 gap-2"></div>
                            </div>
                        </div>
                    </div>

                    <div class="stats-card stats-card-month p-5">
                        <div>
                            <div class="filter-summary-head flex justify-between items-start">
                                <h3 class="text-emerald-600 text-[10px] font-bold uppercase tracking-widest" id="monthTitle">本月統計</h3>
                                <div class="filter-count-line text-[10px] text-emerald-700/70"><span id="mCountsLabel">月度數量</span>: <span class="text-emerald-800 font-bold" id="mCounts">冷0 / 洗0 / 水0</span></div>
                            </div>
                            <div class="metric-box-grid mt-3">
                                <div class="metric-box metric-box-rev">
                                    <span class="metric-box-label" id="mRevLabel">本月總營收</span>
                                    <span class="metric-box-value" id="mRev">$0</span>
                                </div>
                                <div class="metric-box metric-box-exp">
                                    <span class="metric-box-label" id="mExpLabel">本月支出</span>
                                    <button onclick="showMonthAssistantDetails()" id="mExp">$0</button>
                                </div>
                                <div class="metric-box metric-box-net">
                                    <span class="metric-box-label" id="mNetLabel">本月淨利</span>
                                    <span class="metric-box-value" id="mNet">$0</span>
                                </div>
                            </div>
                            
                            <div id="passSummarySection" class="pass-summary-wrap pass-month-theme pass-collapsed border-t border-emerald-100 bg-white/65 -mx-5 px-3 hidden">
                                <button type="button" class="pass-summary-head" onclick="togglePassSummary('passSummarySection')">
                                    <span class="pass-summary-title-area">
                                        <h3 class="text-emerald-700 text-[10px] font-bold uppercase tracking-widest flex items-center gap-1">
                                            <i data-lucide="forward" class="w-3 h-3"></i> <span id="passFilteredTitle">PASS 來源統計 (月度)</span>
                                        </h3>
                                    </span>
                                    <span class="pass-summary-actions">
                                        <span class="pass-total-pill" id="passMonthTotal">總額 $0</span>
                                        <span class="pass-toggle-pill"><span class="pass-toggle-text">展開</span></span>
                                    </span>
                                </button>
                                <div id="passSummaryList" class="pass-summary-list grid grid-cols-1 gap-2"></div>
                            </div>
                        </div>

                        <!-- 舊有待收區塊已隱藏 -->
                        <div id="unpaidSection" class="hidden"></div>
                    </div>
            </section>
